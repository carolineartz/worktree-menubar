<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Style-guide icon family: Big Sur squircle (824/1024, r185), gradient bg,
       white stroke glyph at 1.55/16 scale, one accent node. Gradient is this
       app's own (forest→teal); pr-menubar keeps indigo→violet. -->
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2FA35C"/><stop offset="1" stop-color="#0E8C8C"/>
  </linearGradient></defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(232, 232) scale(35)" fill="none" stroke="#ffffff" stroke-width="1.55" stroke-linecap="round">
    <!-- tree: canopy over trunk, plus a git-branch stub out to the accent node -->
    <circle cx="7.6" cy="4.6" r="2.9"/>
    <path d="M7.6 7.5v6.9"/>
    <path d="M7.6 12l3-1.7"/>
    <circle cx="12.1" cy="9.4" r="1.3" fill="#FFD60A" stroke="none"/>
  </g>
</svg>
